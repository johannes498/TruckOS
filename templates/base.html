<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="description" content="TruckOS 2.0 – AI, lastbiler, service, truckparkering, brændstof, GPS og vejhjælp til chauffører og vognmænd."><title>{% block title %}TruckOS 2.0{% endblock %}</title><link rel="manifest" href="/static/manifest.json"><link rel="icon" href="/static/icon-192.png"><link rel="apple-touch-icon" href="/static/icon-192.png"><link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"></head><body><header class="topbar"><a href="/" class="brand">🚛 <strong>TruckOS</strong><span>2.0</span></a><nav>{% if session.get('user_id') %}<a href="/road">🗺️ På vejen</a><a href="/download">📱 App</a><a href="/logout">Log ud</a>{% endif %}</nav></header>{% with messages=get_flashed_messages() %}{% if messages %}<div class="flash-wrap">{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}</div>{% endif %}{% endwith %}<main>{% block content %}{% endblock %}</main><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/sw.js').catch(()=>{})}</script>{% block scripts %}{% endblock %}</body></html>
