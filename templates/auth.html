{% extends 'base.html' %}{% block content %}<main class="auth-wrap"><section class="auth-card"><h1>{{ 'Opret TruckOS-konto' if mode=='register' else 'Log ind på TruckOS' }}</h1><form method="post" class="stack"><input type="email" name="email" placeholder="E-mail" required><input type="password" name="password" placeholder="Adgangskode (min. 8 tegn)" required><button>{{ 'Opret konto' if mode=='register' else 'Log ind' }}</button></form><p>{% if mode=='register' %}Har du allerede en konto? <a href="{{ url_for('login') }}">Log ind</a>{% else %}Ny bruger? <a href="{{ url_for('register') }}">Opret konto</a>{% endif %}</p></section></main>{% endblock %}
